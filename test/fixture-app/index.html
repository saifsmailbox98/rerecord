<!doctype html>
<html>
  <body>
    <p id="answer">loading</p>
    <button id="again">Again</button>
    <button id="open">Open intro</button>
    <div id="intro" role="dialog" aria-label="Intro" style="display: none; position: fixed; inset: 0; background: #0008">
      <div style="margin: 40px; height: 120px; background: #eee">Card</div>
    </div>
    <script>
      const load = () =>
        fetch("/api/thing")
          .then((response) => response.json())
          .then((data) => (document.getElementById("answer").textContent = data.text));
      load();
      document.getElementById("again").addEventListener("click", load);
      const intro = document.getElementById("intro");
      document.getElementById("open").addEventListener("click", () => (intro.style.display = "block"));
      // Like a modal's backdrop: a click outside the card closes it, a click on the card does not.
      intro.addEventListener("click", (event) => event.target === intro && (intro.style.display = "none"));
    </script>
  </body>
</html>
